name: Release

# Builds and publishes release binaries when a version tag is pushed
# Triggers: git tag -a v0.1.10 -m "Release v0.1.10" && git push origin v0.1.10

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.1.10)'
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  # Verify CI passed before releasing
  verify-ci:
    name: Verify CI Status
    runs-on: ubuntu-latest
    steps:
      - name: Get commit SHA for tag
        id: sha
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG=${GITHUB_REF#refs/tags/}
          fi

          # Get the commit SHA that the tag points to
          SHA=$(gh api repos/${{ github.repository }}/git/refs/tags/$TAG --jq '.object.sha')

          # If it's an annotated tag, get the actual commit
          TYPE=$(gh api repos/${{ github.repository }}/git/tags/$SHA --jq '.object.type' 2>/dev/null || echo "commit")
          if [ "$TYPE" == "commit" ]; then
            COMMIT_SHA=$(gh api repos/${{ github.repository }}/git/tags/$SHA --jq '.object.sha' 2>/dev/null || echo "$SHA")
          else
            COMMIT_SHA=$SHA
          fi

          echo "sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "Tag $TAG points to commit: $COMMIT_SHA"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check CI status
        run: |
          echo "Checking CI status for commit: ${{ steps.sha.outputs.sha }}"

          # Must match the terminal gate job name in .github/workflows/ci.yml
          # (job id: ci-success, display name: CI Success).
          EXPECTED_CHECKS=(
            "CI Success"
          )

          # Wait for CI to complete (max 10 minutes)
          for i in {1..20}; do
            CHECK_RUNS=$(gh api repos/${{ github.repository }}/commits/${{ steps.sha.outputs.sha }}/check-runs \
              --jq '.check_runs | map({name, status, conclusion})')

            MISSING_CHECKS=()
            FAILED_CHECKS=()
            PENDING_CHECKS=()

            for CHECK_NAME in "${EXPECTED_CHECKS[@]}"; do
              MATCH_COUNT=$(echo "$CHECK_RUNS" | jq --arg name "$CHECK_NAME" '[.[] | select(.name == $name)] | length')

              if [ "$MATCH_COUNT" -eq 0 ]; then
                MISSING_CHECKS+=("$CHECK_NAME")
                continue
              fi

              FAILED_COUNT=$(echo "$CHECK_RUNS" | jq --arg name "$CHECK_NAME" '
                [.[]
                 | select(.name == $name)
                 | select(.conclusion == "failure"
                          or .conclusion == "cancelled"
                          or .conclusion == "timed_out"
                          or .conclusion == "action_required"
                          or .conclusion == "startup_failure"
                          or .conclusion == "stale")] | length')

              if [ "$FAILED_COUNT" -gt 0 ]; then
                DETAILS=$(echo "$CHECK_RUNS" | jq -c --arg name "$CHECK_NAME" '[.[] | select(.name == $name)]')
                FAILED_CHECKS+=("$CHECK_NAME => $DETAILS")
                continue
              fi

              SUCCESS_COUNT=$(echo "$CHECK_RUNS" | jq --arg name "$CHECK_NAME" '[.[] | select(.name == $name and .conclusion == "success")] | length')
              if [ "$SUCCESS_COUNT" -lt "$MATCH_COUNT" ]; then
                DETAILS=$(echo "$CHECK_RUNS" | jq -c --arg name "$CHECK_NAME" '[.[] | select(.name == $name)]')
                PENDING_CHECKS+=("$CHECK_NAME => $DETAILS")
              fi
            done

            if [ "${#FAILED_CHECKS[@]}" -gt 0 ]; then
              STATUS="failure"
            elif [ "${#MISSING_CHECKS[@]}" -gt 0 ] || [ "${#PENDING_CHECKS[@]}" -gt 0 ]; then
              STATUS="pending"
            else
              STATUS="success"
            fi

            echo "Attempt $i: CI status = $STATUS"

            if [ "$STATUS" == "success" ]; then
              echo "✅ CI passed! Proceeding with release."
              exit 0
            elif [ "$STATUS" == "failure" ]; then
              echo "❌ CI failed! Cannot release."
              printf 'Failed checks:\n'
              printf '  - %s\n' "${FAILED_CHECKS[@]}"
              exit 1
            fi

            if [ "${#MISSING_CHECKS[@]}" -gt 0 ]; then
              echo "Missing checks: ${MISSING_CHECKS[*]}"
            fi
            if [ "${#PENDING_CHECKS[@]}" -gt 0 ]; then
              printf 'Pending checks:\n'
              printf '  - %s\n' "${PENDING_CHECKS[@]}"
            fi

            echo "⏳ CI still running, waiting 30s..."
            sleep 30
          done

          echo "❌ Timeout waiting for CI. Status: $STATUS"
          if [ "${#MISSING_CHECKS[@]}" -gt 0 ]; then
            echo "Missing checks at timeout: ${MISSING_CHECKS[*]}"
          fi
          if [ "${#PENDING_CHECKS[@]}" -gt 0 ]; then
            printf 'Pending checks at timeout:\n'
            printf '  - %s\n' "${PENDING_CHECKS[@]}"
          fi
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build binaries for all platforms in parallel
  build-linux-x64:
    needs: verify-ci
    uses: ./.github/workflows/_build-release.yml
    with:
      os: ubuntu-latest
      target: x86_64-unknown-linux-musl  # Static linking, no GLIBC dependency
      artifact-name: ie
      asset-name: intent-engine-linux-x86_64

  build-linux-arm64:
    needs: verify-ci
    uses: ./.github/workflows/_build-release.yml
    with:
      os: ubuntu-latest
      target: aarch64-unknown-linux-musl  # Static linking, no GLIBC dependency
      artifact-name: ie
      asset-name: intent-engine-linux-aarch64

  build-macos-x64:
    needs: verify-ci
    uses: ./.github/workflows/_build-release.yml
    with:
      os: macos-latest
      target: x86_64-apple-darwin
      artifact-name: ie
      asset-name: intent-engine-macos-x86_64

  build-macos-arm64:
    needs: verify-ci
    uses: ./.github/workflows/_build-release.yml
    with:
      os: macos-latest
      target: aarch64-apple-darwin
      artifact-name: ie
      asset-name: intent-engine-macos-aarch64

  build-windows-x64:
    needs: verify-ci
    uses: ./.github/workflows/_build-release.yml
    with:
      os: windows-latest
      target: x86_64-pc-windows-msvc
      artifact-name: ie.exe
      asset-name: intent-engine-windows-x86_64.exe

  # Create GitHub Release
  release:
    name: Create GitHub Release
    needs:
      - build-linux-x64
      - build-linux-arm64
      - build-macos-x64
      - build-macos-arm64
      - build-windows-x64
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Display artifact structure
        run: |
          echo "Artifact directory structure:"
          ls -lR artifacts/

      - name: Get release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            if [ -z "$TAG" ]; then
              echo "❌ Error: tag input is required for manual trigger"
              exit 1
            fi
          else
            TAG=${GITHUB_REF#refs/tags/}
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"

      - name: Delete existing release (if exists)
        continue-on-error: true
        run: |
          gh release delete ${{ steps.tag.outputs.tag }} --yes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${{ steps.tag.outputs.tag }}"
          echo "Generating release notes for $VERSION"

          # Create release notes file
          cat > release_notes.md << 'EOF'
          ## 🚀 What's Changed

          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for full details.

          ## 📦 Installation

          ### Using Homebrew (macOS/Linux)
          ```bash
          brew tap wayfind/tap
          brew install intent-engine
          ```

          ### Using cargo-binstall (Recommended for Rust users)
          ```bash
          cargo binstall intent-engine
          ```

          ### Download Pre-built Binary
          Download the appropriate binary for your platform below.

          ### Build from Source
          ```bash
          cargo install --git https://github.com/${{ github.repository }} --tag $VERSION
          ```

          ## 🔍 Verification

          After installation, verify with:
          ```bash
          ie --version
          ie doctor
          ```

          ## 📚 Documentation

          - User guide: https://github.com/${{ github.repository }}/tree/main/docs/help
          - Full interface spec: https://github.com/${{ github.repository }}/tree/main/docs/spec-03-interface-current.md
          EOF

          test -s release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          body_path: release_notes.md
          files: artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          echo "## 🎉 Release Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ steps.tag.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**Binaries**: 5 platforms" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View release: https://github.com/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.tag }}" >> $GITHUB_STEP_SUMMARY

  # Publish to crates.io
  publish-crates:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Get release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            if [ -z "$TAG" ]; then
              echo "❌ Error: tag input is required for manual trigger"
              exit 1
            fi
          else
            TAG=${GITHUB_REF#refs/tags/}
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify version matches tag
        run: |
          TAG_VERSION="${{ steps.tag.outputs.tag }}"
          TAG_VERSION=${TAG_VERSION#v}
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)

          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "❌ Version mismatch!"
            echo "Tag version: $TAG_VERSION"
            echo "Cargo.toml version: $CARGO_VERSION"
            exit 1
          fi

          echo "✅ Version verified: $CARGO_VERSION"

      - name: Dry run publish
        run: cargo publish --dry-run --allow-dirty

      - name: Publish to crates.io
        run: cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish summary
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)
          echo "## 📦 Published to crates.io" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "**Package**: https://crates.io/crates/intent-engine" >> $GITHUB_STEP_SUMMARY
